<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Orrery</title>
<!-- The Pi's touchscreen page (800x480), served by server.py. Same layout as the
     front-panel mock-up on the website (site/index.html, drawTouch), but it draws the
     Pi's live state from /api/state and sends every tap to /api/action. -->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:100vw; height:60vw; max-height:100vh; max-width:166.67vh; container-type:size; }
  #s { width:100%; height:100%; display:block; }
  /* PLANETS tab: the 3D globe (planets.js) sits over x 8-348, y 128-434 of the 800x480 screen. */
  #p3 { position:absolute; left:1%; top:26.667%; width:42.5%; height:63.75%; display:none; border-radius:1.5% / 2.5%; touch-action:none; }
  /* Facts hidden: the globe fills everything below the planet buttons (y 128-480;
     up to 452 when the red problem banner is showing). */
  #stage.full #p3 { left:0; width:100%; height:73.333%; border-radius:0; }
  #stage.full.banner #p3 { height:67.5%; }
  /* Sizes in cqw (1cqw = 8 px of the 800 px screen) so they scale with the canvas. */
  #p3btn { position:absolute; left:37.25%; top:28.33%; height:5.5cqw; min-width:5.5cqw; display:none; align-items:center; justify-content:center; gap:1cqw;
           padding:0 1cqw; box-sizing:border-box; border-radius:1.2cqw; border:1px solid rgba(255,255,255,.25); background:rgba(20,27,56,.78);
           color:#fff; font:600 2.2cqw system-ui, sans-serif; touch-action:manipulation; }
  #p3btn svg { width:2.8cqw; height:2.8cqw; }
  #stage.full #p3btn { left:auto; right:1.25%; padding:0 1.8cqw; }
  #p3hint { position:absolute; left:0; right:0; bottom:3%; text-align:center; color:rgba(215,225,255,.9); font:500 2cqw system-ui, sans-serif;
            text-shadow:0 0 .6cqw #000; pointer-events:none; opacity:0; transition:opacity .8s; }
  #p3hint.on { opacity:1; }
  #p3credit { position:absolute; left:1.25%; bottom:1.2%; color:rgba(150,160,200,.65); font:500 1.4cqw system-ui, sans-serif; pointer-events:none; display:none; }
  #stage.full #p3credit { display:block; }
  /* RUN tab (the SOLAR SYSTEM view until 7 Nov 2026; class 'sys'): the 3D view fills everything
     below the tabs (y 64-480): Run / Pause top right, the date bottom left and the speed
     control bottom right (7 Nov 2026, the user; 13 Nov 2026: bigger buttons, no credit line,
     a soft shade under the date so it reads over the planets). */
  #stage.sys #p3 { left:0; top:13.333%; width:100%; height:86.667%; border-radius:0; }
  #stage.sys.banner #p3 { height:80.833%; }
  #sysfade { position:absolute; left:0; right:0; bottom:0; height:34%; display:none; pointer-events:none;
             background:linear-gradient(to bottom, rgba(2,3,10,0), rgba(2,3,10,.82)); }
  #stage.sys #sysfade { display:block; }
  #sysinfo { position:absolute; left:2.25%; bottom:3.6%; color:#fff; font:700 5cqw system-ui, sans-serif; letter-spacing:-.02em; text-shadow:0 0 1cqw #000; pointer-events:none; display:none; }
  #sysinfo small { display:flex; align-items:center; gap:1cqw; margin-top:.5cqw; color:#c9d3f2; font:500 2cqw system-ui, sans-serif; letter-spacing:0; }
  #sysinfo small i { width:1.4cqw; height:1.4cqw; border-radius:50%; flex:none; }
  #sysrun { position:absolute; right:1.5%; top:15.4%; height:8cqw; min-width:19cqw; padding:0 2.6cqw; display:none; align-items:center; justify-content:center; border-radius:2cqw;
            border:1px solid rgba(255,255,255,.22); background:rgba(20,27,56,.86); color:#fff; font:700 3cqw system-ui, sans-serif; touch-action:manipulation;
            box-shadow:0 .5cqw 2cqw rgba(0,0,0,.5); }
  #sysrun.go { background:linear-gradient(#37b56a, #278a50); border-color:rgba(190,255,215,.4); }
  #stage.sys #sysinfo { display:block; }
  /* TIME TRAVEL: the same 3D solar system on the right, under the moment's name and date
     (x 306-794, y 142-472 of the 800x480 screen). */
  /* (16 Nov 2026, the user: a narrower, lighter list and a bigger picture) the 3D view fills
     everything right of the 200 px list, below the tabs (x 200-800, y 64-480). */
  #stage.trav #p3 { display:block; left:25%; top:13.333%; width:75%; height:86.667%; border-radius:0; }
  #stage.trav.banner #p3 { height:80.833%; }
  #stage.sys #sysrun { display:flex; }
  /* RUN speed:  -  N yr/min  +  bottom right; the buttons 80 x 72 px (13 Nov 2026, the user: bigger to press). */
  #sysspeed { position:absolute; right:1.5%; bottom:3.6%; height:9cqw; display:none; align-items:stretch; border-radius:2cqw; overflow:hidden;
              border:1px solid rgba(255,255,255,.22); background:rgba(20,27,56,.92); color:#fff; box-shadow:0 .5cqw 2cqw rgba(0,0,0,.5); }
  #sysspeed button { width:10cqw; border:0; background:rgba(255,255,255,.09); color:#fff; font:700 5.6cqw system-ui, sans-serif; line-height:1; touch-action:manipulation; }
  #sysspeed button:active { background:rgba(120,160,255,.35); }
  #sysspeed button:disabled { color:rgba(255,255,255,.22); background:rgba(255,255,255,.03); }
  #sysspeed span { min-width:15cqw; display:flex; flex-direction:column; align-items:center; justify-content:center; font:700 3.2cqw system-ui, sans-serif; }
  #sysspeed span small { color:#9aa6c9; font:600 1.6cqw system-ui, sans-serif; letter-spacing:.06em; }
  #stage.sys #sysspeed { display:flex; }
  #stage.sys.banner #sysinfo, #stage.sys.banner #sysspeed { bottom:9.5%; }   /* above the red banner */
  #stage.sys #p3hint { bottom:auto; top:16.5%; right:24%; }                              /* clear of the date and the speed control */
  /* TIME TRAVEL with no moment chosen (14 Nov 2026, the user): no heading, the picture fills
     the panel and the date sits bottom right. */
  /* The moment's name (small, in its colour) over its date and how long ago, bottom right
     of the picture (16 Nov 2026; with no moment chosen, just the date). */
  #travdate { position:absolute; right:2%; bottom:3%; text-align:right; color:#fff; font:700 3.4cqw system-ui, sans-serif; letter-spacing:-.02em;
              text-shadow:0 0 1cqw #000, 0 0 .4cqw #000; pointer-events:none; display:none; }
  #travdate b { display:block; font:700 2.1cqw system-ui, sans-serif; letter-spacing:0; margin-bottom:.2cqw; }
  #travdate small { display:block; color:#ffd36b; font:600 1.9cqw system-ui, sans-serif; letter-spacing:0; margin-top:.3cqw; }
  #stage.trav #travdate { display:block; }
  #stage.trav.banner #travdate { bottom:9%; }
  /* PLANETS, the dwarf planets' page: All / Ceres / Pluto / ... along the bottom of the globe. */
  #dwarfs { position:absolute; left:1%; width:42.5%; bottom:12.6%; display:none; justify-content:center; gap:.5cqw; }
  #dwarfs button { height:4.4cqw; padding:0 .75cqw; border-radius:1.1cqw; border:1px solid rgba(255,255,255,.22); background:rgba(20,27,56,.86); color:#c9d3f2;
                   font:600 1.5cqw system-ui, sans-serif; touch-action:manipulation; }
  #dwarfs button.on { background:#2f6fde; border-color:#8fb4ff; color:#fff; }
  #stage.dw #dwarfs { display:flex; }
  #stage.dw.full #dwarfs { left:0; width:100%; bottom:5.5%; gap:1cqw; }
  #stage.dw.full #dwarfs button { height:6.5cqw; padding:0 2cqw; border-radius:1.6cqw; font:600 2.3cqw system-ui, sans-serif; }
  #stage.dw.full.banner #dwarfs { bottom:11%; }
  #stage.dw.full #p3hint { bottom:21%; }
  /* SCALE tab: the 3D picture fills everything below the tabs; a line of text along the bottom. */
  #stage.scl3d #p3 { left:0; top:13.333%; width:100%; height:86.667%; border-radius:0; }
  /* GALAXY tab (14 Nov 2026): the 3D Milky Way fills everything below the tabs; the Facts button
     (top right) brings in the words on the left (x 0-236) and the picture takes the rest. */
  #stage.gal #p3 { left:0; top:13.333%; width:100%; height:86.667%; border-radius:0; }
  #stage.gal.galfacts #p3 { left:29.5%; width:70.5%; }
  #stage.gal.banner #p3 { height:80.833%; }
  #stage.gal.galfacts #p3hint { left:29.5%; }
  #galbtn { position:absolute; right:1.5%; top:15.4%; height:7cqw; padding:0 2.4cqw; display:none; align-items:center; justify-content:center; border-radius:1.8cqw;
            border:1px solid rgba(255,255,255,.25); background:rgba(20,27,56,.82); color:#fff; font:700 2.6cqw system-ui, sans-serif; touch-action:manipulation;
            box-shadow:0 .5cqw 2cqw rgba(0,0,0,.5); }
  #stage.gal #galbtn { display:flex; }
  #stage.gal.galfacts #galbtn { background:#2f6fde; border-color:#8fb4ff; }
  /* TIME MACHINE countdown (14 Nov 2026): a big 3-2-1 over everything before the arms move. */
  #count { position:absolute; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center;
           background:rgba(2,3,10,.88); color:#fff; font-family:system-ui, sans-serif; touch-action:none; }
  #count.on { display:flex; }
  #count .stand { color:#ffb300; font:800 5.6cqw system-ui, sans-serif; letter-spacing:.03em; }
  #count .num { height:24cqw; display:flex; align-items:center; }
  #count b { display:block; font:800 24cqw/1 system-ui, sans-serif; text-shadow:0 0 3cqw rgba(255,179,0,.45); animation:cdpop 1s ease-out both; }
  #count .to { color:#dfe6ff; font:600 2.7cqw system-ui, sans-serif; }
  #count small { margin-top:1.4cqw; color:#8fa0cf; font:600 2cqw system-ui, sans-serif; }
  @keyframes cdpop { 0% { transform:scale(1.5); opacity:0; } 20% { transform:scale(1); opacity:1; } 100% { transform:scale(.88); opacity:.8; } }
  body.kiosk { cursor:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="s" width="800" height="480"></canvas><canvas id="p3"></canvas><div id="sysfade"></div>
  <button id="p3btn" title="Hide or show the facts"></button><div id="p3credit"></div><div id="p3hint">Drag to look all round · pinch to zoom · double-tap to reset</div>
  <div id="sysinfo"></div><button id="sysrun"></button><button id="galbtn">Facts</button><div id="travdate"></div><div id="dwarfs"></div>
  <div id="sysspeed"><button id="sysslow">−</button><span id="sysypm"></span><button id="sysfast">+</button></div>
  <div id="count"><div class="stand">Stand back!</div><div class="num"><b>3</b></div><div class="to"></div><small>Tap anywhere to stop</small></div>
</div>
<script src="three.min.js"></script>
<script src="planets.js"></script>
<script>
// index.html?sim = no Pi: sim.js stands in for server.py (the website's front-panel mock-up).
if (new URLSearchParams(location.search).has('sim')) document.write('<script src="sim.js"><\/script>');
</script>
<script>
const cv = document.getElementById('s'), g = cv.getContext('2d');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COLORS = ['#9a9a9a','#e8c27a','#3a8ee6','#d9534f','#d8a06a','#e6d08a','#7fe0d8','#4666ff','#c9b29b'];
const PV = window.PlanetView;
// PLANETS tab: facts shown (globe on the left) or hidden (globe fills the screen). This
// screen only. Every visit to the tab starts on Saturn with the facts showing (14 Nov 2026,
// the user; for a while that day it opened with the globe full screen).
const stage = document.getElementById('stage'), p3btn = document.getElementById('p3btn'), p3hint = document.getElementById('p3hint');
const ICON = { grow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>',
               shrink:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></svg>' };
let full = null, hintTimer = 0, lastMode = null;
// The dwarf planets' page: 0 = all five together, 1 ... = one of PV.DWARFS. This screen only.
let dwarf = 0;
const dwarfRow = document.getElementById('dwarfs');
['All together'].concat((PV.DWARFS || []).map(D => D.name)).forEach((name, k) => {
  const b = document.createElement('button'); b.textContent = name;
  b.addEventListener('click', () => { dwarf = k; draw(); });
  dwarfRow.appendChild(b);
});
function hint(text) {                                        // shown for a few seconds
  clearTimeout(hintTimer);
  if (text) { p3hint.textContent = text; p3hint.classList.add('on'); hintTimer = setTimeout(() => p3hint.classList.remove('on'), 4500); }
  else p3hint.classList.remove('on');
}
function setFull(on) {
  if (on === full) return;
  full = on; stage.classList.toggle('full', on);
  p3btn.innerHTML = on ? ICON.shrink + 'Facts' : ICON.grow;
  hint(on && 'Drag to look all round · pinch to zoom · double-tap to reset');
}
setFull(false);
p3btn.addEventListener('click', () => { setFull(!full); draw(); });
if (new URLSearchParams(location.search).has('kiosk')) document.body.classList.add('kiosk');

let S = null, V = null, hits = [], offline = false, base = 0, shown = null, BG = null;

// While running, the screen animates on its own at the display's frame rate: from the
// Pi's last date (S.day, days since 2000-01-01) and speed it works out the in-between
// date and planet angles; each poll just corrects it. Polls can then be slow (250 ms).
const SIM = window.orrerySim;
async function getState() {
  const t0 = performance.now(), st = SIM ? SIM.state() : await (await fetch('/api/state', { cache:'no-store' })).json();
  S = st; base = (t0 + performance.now()) / 2;              // mid-request ~ when the Pi answered
  offline = false;
}
async function poll() {
  try { await getState(); } catch (e) { offline = true; }
  draw();
  setTimeout(poll, S && S.running ? 250 : S && S.moving ? 120 : 350);
}
async function act(a) {
  try {
    if (SIM) SIM.act(a);
    else await fetch('/api/action', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(a) });
    await getState();
  } catch (e) { offline = true; }
  draw();
}
// Dates for any day number, BC too (as planets.py): Julian calendar before 15 Oct 1582,
// Gregorian after; year 0 = 1 BC.
function calFromDay(day) {
  const fl = Math.floor, Z = fl(Math.round(day) + 2451545), al = fl((Z - 1867216.25) / 36524.25), A = Z < 2299161 ? Z : Z + 1 + al - fl(al / 4);
  const B = A + 1524, C = fl((B - 122.1) / 365.25), D = fl(365.25 * C), E = fl((B - D) / 30.6001), m = E < 14 ? E - 1 : E - 13;
  return [m > 2 ? C - 4716 : C - 4715, m, B - D - fl(30.6001 * E)];
}
const yearText = y => y <= 0 ? `${1 - y} BC` : y < 1000 ? `${y} AD` : String(y);
const deepText = () => `${(S.deep / 1e6).toLocaleString()} million years ago`;
function view() {                                           // S, moved on to "now" if running
  if (!S || !S.running) { shown = null; return S; }
  const perS = S.years_per_min * 365.25 / 60;
  let day = S.day + perS * (performance.now() - base) / 1000;
  // A poll that lands a little behind would make the date tick backwards: hold instead
  // (only for small gaps - a real jump such as a new start date is shown at once).
  if (shown !== null && day < shown && shown - day < perS * 0.5 + 1) day = shown;
  shown = day;
  const dday = day - S.day;
  return { ...S, day, ymd:calFromDay(day),
           lon:S.lon.map((a, p) => a + S.mean[p] * dday) };
}
function frame() { if (S && (S.running || trip.t0)) draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function at(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 800 / r.width, (e.clientY - r.top) * 480 / r.height]; }
cv.addEventListener('pointerdown', e => {
  const [x, y] = at(e);
  if (S && S.mode === 'health' && S.manual && mgauge && x >= mgauge.x0 - 24 && x <= mgauge.x1 + 24 && Math.abs(y - mgauge.y) <= 32) {
    cv.setPointerCapture(e.pointerId); mdrag = { rpm:null, sent:0 }; mgaugeTo(x); return;
  }
  const hit = hits.find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
  if (hit) { if (hit.a.do === 'home' || hit.a.do === 'unhome') { homeAsk = false; clearTimeout(homeAskTimer); } hit.a.local ? localTap(hit.a.local) : send(hit.a); }
});
// TIME MACHINE countdown (14 Nov 2026, the user: kids tap a moment and the arms swing at
// once, before they've stepped back). A moment or GO first shows a big 3, 2, 1 over the
// whole screen with where it's going; then the action is sent. Tap anywhere to stop it.
// Not on the website (sim.js), where nothing moves; not for the moment already shown.
// Also into and out of travel mode (the settings' TRAVEL MODE / Back to the date, and Run
// on ORBITS while in travel mode), 14 Nov 2026, the user.
const countEl = document.getElementById('count'), COUNT_S = 3;
let counting = null;
function willMove(a) {                                     // what the countdown says, or null: no countdown
  if (SIM || !S) return null;
  if (a.do === 'go') return 'Going to ' + longDate(S.entry);
  if (a.do === 'lineup' && !!a.on !== S.lined_up) return a.on ? 'Going to travel mode' : 'Going back to the date';
  if (a.do === 'press' && S.lined_up && !S.running && S.mode === 'run') return 'Leaving travel mode to run';
  if (a.do === 'manual' && !a.on && S.manual) return S.lined_up ? 'Going back to travel mode' : 'Going back to the date';   // AUTO: every arm moves
  if (a.do === 'tab' && (a.mode === 'travel' || a.mode === 'run') && S.manual && S.mode !== a.mode) return 'Leaving manual mode';   // TIME MACHINE / ORBITS switch to AUTO (server.py)
  if (a.do === 'travel' && !(a.n === S.trip && !S.running && !S.lined_up))   // not if already there, or on its way
    return 'Going to ' + (TRIPS[a.n].now ? 'today' : TRIPS[a.n].name);
  return null;
}
function send(a) { const why = willMove(a); why ? countdown(a, why) : act(a); }
function countdown(a, why) {
  stopCount();
  const t0 = performance.now();
  counting = { a, timer:0 };
  countEl.querySelector('.to').textContent = why;
  const tick = () => {
    const gone = performance.now() - t0, left = COUNT_S - Math.floor(gone / 1000);
    if (left <= 0) { const go = counting.a; stopCount(); act(go); return; }
    const num = countEl.querySelector('.num'), b = document.createElement('b');   // a new element restarts the pop
    b.textContent = left; num.replaceChildren(b);
    counting.timer = setTimeout(tick, 1000 - gone % 1000 + 5);
  };
  countEl.classList.add('on');
  tick();
}
function stopCount() {
  if (counting) clearTimeout(counting.timer);
  counting = null; countEl.classList.remove('on');
}
countEl.addEventListener('pointerdown', e => { e.preventDefault(); stopCount(); });
cv.addEventListener('pointermove', e => { if (mdrag) mgaugeTo(at(e)[0]); });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => {
  if (mdrag && mdrag.rpm !== null) act({ do:'mspeed', rpm:mdrag.rpm });
  mdrag = null;
}));
// Keyboard, for testing in a browser: arrows = choose (speed, moment), Enter = Run/GO, T = today.
addEventListener('keydown', e => {
  const k = { ArrowRight:{ do:'turn', n:1 }, ArrowUp:{ do:'turn', n:1 }, ArrowLeft:{ do:'turn', n:-1 }, ArrowDown:{ do:'turn', n:-1 },
              Enter:{ do:'press' }, ' ':{ do:'press' }, t:{ do:'today' } }[e.key];
  if (k) { e.preventDefault(); act(k); }
});

function button(x, y, w, h, label, fill, a, size = 30) {
  g.fillStyle = fill; g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill();
  g.fillStyle = '#fff'; g.font = `600 ${size}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, x + w / 2, y + h / 2 + 1); g.textBaseline = 'alphabetic';
  hits.push({ x, y, w, h, a });
}
function draw() {
  hits = []; V = view();
  g.fillStyle = BG || (BG = (() => { const q = g.createLinearGradient(0, 64, 0, 480); q.addColorStop(0, '#0d1433'); q.addColorStop(1, '#070a1b'); return q; })());
  g.fillRect(0, 0, 800, 480);
  if (!S) { PV.hide(); p3btn.style.display = 'none'; centre(offline ? 'Waiting for the orrery…' : 'Starting…'); return; }
  if (S.off) {                                              // shutting down (the "poweroff" action; no button for it since 13 Nov 2026)
    ['sys', 'trav', 'dw', 'scl', 'scl3d', 'gal', 'galfacts', 'banner'].forEach(c => stage.classList.remove(c));
    PV.hide(); setFull(false); p3btn.style.display = 'none'; hint();
    drawOff();
    return;
  }
  // The orrery keeps running on the other tabs; the ORBITS tab says so. (7 Nov 2026: the old
  // RUN screen went and SOLAR SYSTEM became RUN.)
  // Four tabs and the settings gear (the Turn off button went 13 Nov 2026, the user: not needed).
  // 14 Nov 2026 (the user): RUN is now ORBITS and TIME TRAVEL is TIME MACHINE, next to it
  // (both move the planets). The modes inside are still 'run' and 'travel'.
  // Five tabs since 14 Nov 2026 (GALAXY, between PLANETS and SCALE), all at one size: the
  // widths (sum 736, the gear after) are each label's width at 21 px plus the same margin.
  const runLabel = S.running && S.mode !== 'run' ? `ORBITS ▶ ${short(S.years_per_min)}` : 'ORBITS';
  g.fillStyle = '#10173a'; g.fillRect(0, 0, 800, 64);
  g.fillStyle = '#1d2750'; g.fillRect(0, 63, 800, 1);
  let tx = 0;
  [[runLabel, 'run', 126], ['TIME MACHINE', 'travel', 196], ['PLANETS', 'planets', 146], ['GALAXY', 'galaxy', 140], ['SCALE', 'scale', 128]].forEach(([label, m, tw]) => {
    const on = S.mode === m;
    if (on) tabPill(tx, tw);
    g.fillStyle = on ? '#fff' : '#93a0c8'; g.font = fit(label, tw - 22, 21, 700); g.textAlign = 'center';
    g.fillText(label, tx + tw / 2, 42);
    hits.push({ x:tx, y:0, w:tw, h:64, a:{ do:'tab', mode:m } });
    tx += tw;
  });
  healthTab(736, S.mode === 'health');
  p3btn.style.display = S.mode === 'planets' && PV.ok ? 'flex' : 'none';
  const wasSys = stage.classList.contains('sys');

function fit(text, w, size, weight) {

function wrap(text, w) {
